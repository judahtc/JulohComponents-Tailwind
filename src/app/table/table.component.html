<div class="md:flex items-start space-x-6">

      <thead>
        <tr class="border-b text-left">
          <th class="py-2.5 px-3">{{columns.id}}</th>
          <th class="py-2.5 px-3">{{columns.component}}</th>

          <th class="py-2.5 px-3">{{columns.items}}</th>

        </tr>
      </thead>
      <tbody>
        <tr class="border-b text-sm bg-white"
          *ngFor="let item of collection| paginate: { itemsPerPage:itemsPerPage, currentPage: p }">
          <td class="px-3 py-2.5">{{item.id}}</td>
          <td class="px-3 py-2.5">{{item.component}}</td>

          <td class="px-3 py-2.5">{{item.items}}</td>
          <td class="px-3 py-2.5">{{item.description}}</td>

          <td class="px-3 py-2.5"><button class="bg-transparent text-sm ">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-download">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" x2="12" y1="15" y2="3" />
              </svg></button></td>
          <td class="px-3 py-2.5 hover:cursor-pointer">

            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
              stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-ellipsis-vertical">
              <circle cx="12" cy="12" r="1" />
              <circle cx="12" cy="5" r="1" />
              <circle cx="12" cy="19" r="1" />
            </svg>


          </td>

        </tr>
      </tbody>
    </table>

  </div>

<div class="flex justify-start mt-4">
  <ul class="inline-flex items-center -space-x-px text-sm">
    <li class="border px-2 py-1 rounded-l-md cursor-pointer" [class.hidden]="p === 1"
      (click)="p > 1 && changePage(p - 1)">
      prev
    </li>
    <li *ngFor="let page of data_list" class="border px-2 py-1 cursor-pointer"
      [ngClass]="{ 'text-gray-500': page === p }" (click)="changePage(page)">
      {{ page }}
    </li>
    <li class="border px-2 py-1 rounded-r-md cursor-pointer" [class.hidden]="p === this.len"
      (click)="p < collection.length && changePage(p + 1)">
      next
    </li>
  </ul>
</div>


<div *ngIf="showModal"
  class="fixed top-0 bottom-0 left-0 right-0 bg-gray-800 bg-opacity-60 flex justify-center items-center z-50">
  <!-- Modal content -->
  <div class="w-[450px] bg-white shadow-md rounded-md mb-48">
    <div class="p-4 border-b">
      <h2 class="text-lg font-semibold">Create project</h2>
      <p class="text-sm text-gray-500">Deploy your new project in one-click.</p>
    </div>
    <div class="p-4">
      <form>
        <div class="grid w-full items-center gap-4">
          <div class="flex flex-col space-y-1.5">
            <label for="name" class="text-sm font-medium">Name</label>
            <input id="name" type="text" placeholder="Name of your project" class="border rounded px-3 py-2 text-sm" />
          </div>
          <div class="flex flex-col space-y-1.5">
            <label for="framework" class="text-sm font-medium">Framework</label>
            <select id="framework" class="border rounded px-3 py-2 text-sm">
              <option value="" disabled selected>Select</option>
              <option value="next">Next.js</option>
              <option value="sveltekit">SvelteKit</option>
              <option value="astro">Astro</option>
              <option value="nuxt">Nuxt.js</option>
            </select>
          </div>
        </div>
      </form>
    </div>
    <div class="p-4 flex justify-between border-t">
      <button class="text-sm px-4 py-2 border rounded text-gray-700 hover:bg-gray-50"
        (click)="showModal=false">Cancel</button>
      <button
        class="text-sm px-4 py-2 bg-black text-white rounded hover:bg-transparent hover:text-black hover:outline-offset-1 hover:outline hover:ring-1">Deploy</button>
    </div>
  </div>

</div>
