  <button
    class="text-slate-800 hover:text-white text-sm bg-white hover:bg-black border border-slate-200 font-medium px-4 py-1 inline-flex space-x-1 items-center rounded-md">
    <span>
      Submit
    </span>

    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send-horizontal">

        d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z" />

  <br>

  <br>
  <p class="text-lg font-bold px-10">Radio Button</p>
  <div>
    <div class='w-full max-w-lg px-10 py-8  bg-white rounded-lg shadow-xl'>
      <div class='max-w-md  space-y-6'>
        <div class="space-y-4">
          <p class="text-sm font-medium text-center text-neutral-500">Select a option</p>
          <div class="relative">
            <input type="radio" name="options" id="option1-checkbox" value="1" class="hidden peer">
            <label for="option1-checkbox"
              class="inline-flex items-center justify-between w-full p-5 bg-white border-2 rounded-lg cursor-pointer group border-neutral-200/70 text-neutral-600 peer-checked:border-blue-400 peer-checked:text-neutral-900 peer-checked:bg-blue-200/50 hover:text-neutral-900 hover:border-neutral-300">
              <div class="flex items-center space-x-5">
                <svg class="w-16 h-auto" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                  viewBox="0 0 256 256">
                  <g fill="currentColor">
                    <path
                      d="M224 56v122.06l-39.72-39.72a8 8 0 0 0-11.31 0L147.31 164l-49.65-49.66a8 8 0 0 0-11.32 0L32 168.69V56a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8"
                      opacity="0.2" />
                    <path
                      d="M216 40H40a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m0 16v102.75l-26.07-26.06a16 16 0 0 0-22.63 0l-20 20l-44-44a16 16 0 0 0-22.62 0L40 149.37V56ZM40 172l52-52l80 80H40Zm176 28h-21.37l-36-36l20-20L216 181.38zm-72-100a12 12 0 1 1 12 12a12 12 0 0 1-12-12" />
                  </g>
                </svg>
                <div class="flex flex-col justify-start">
                  <div class="w-full text-lg font-semibold">Option 1</div>
                  <div class="w-full text-sm opacity-60">The first option is cool</div>
                </div>
              </div>
            </label>
          </div>
          <div class="relative">
            <input type="radio" name="options" id="option2-checkbox" value="2" class="hidden peer">
            <label for="option2-checkbox"
              class="inline-flex items-center justify-between w-full p-5 bg-white border-2 rounded-lg cursor-pointer group border-neutral-200/70 text-neutral-600 peer-checked:border-blue-400 peer-checked:text-neutral-900 peer-checked:bg-blue-200/50 hover:text-neutral-900 hover:border-neutral-300">
              <div class="flex items-center space-x-5">
                <svg class="w-16 h-auto" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                  viewBox="0 0 256 256">
                  <g fill="currentColor">
                    <path
                      d="M224 56v122.06l-39.72-39.72a8 8 0 0 0-11.31 0L147.31 164l-49.65-49.66a8 8 0 0 0-11.32 0L32 168.69V56a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8"
                      opacity="0.2" />
                    <path
                      d="M216 40H40a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m0 16v102.75l-26.07-26.06a16 16 0 0 0-22.63 0l-20 20l-44-44a16 16 0 0 0-22.62 0L40 149.37V56ZM40 172l52-52l80 80H40Zm176 28h-21.37l-36-36l20-20L216 181.38zm-72-100a12 12 0 1 1 12 12a12 12 0 0 1-12-12" />
                  </g>
                </svg>
                <div class="flex flex-col justify-start">
                  <div class="w-full text-lg font-semibold">Option 2</div>
                  <div class="w-full text-sm opacity-60">The second option is nice</div>
                </div>
              </div>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
