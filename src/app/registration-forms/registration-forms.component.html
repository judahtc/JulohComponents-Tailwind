<div class="w-[350px] bg-white shadow-md rounded-lg">
  <div class="p-4 border-b">
    <h2 class="text-lg font-semibold">Create project</h2>
    <p class="text-sm text-gray-500">Deploy your new project in one-click.</p>
  </div>
  <div class="p-4">
    <form>
      <div class="grid w-full items-center gap-4">
        <div class="flex flex-col space-y-1.5">
          <label for="name" class="text-sm font-medium">Name</label>
          <input id="name" type="text" placeholder="Name of your project" class="border rounded px-3 py-2 text-sm" />
        </div>
        <div class="flex flex-col space-y-1.5">
          <label for="framework" class="text-sm font-medium">Framework</label>
          <select id="framework" class="border rounded px-3 py-2 text-sm">
            <option value="" disabled selected>Select</option>
            <option value="next">Next.js</option>
            <option value="sveltekit">SvelteKit</option>
            <option value="astro">Astro</option>
            <option value="nuxt">Nuxt.js</option>
          </select>
        </div>
      </div>
    </form>
  </div>
  <div class="p-4 flex justify-between border-t">
    <button class="text-sm px-4 py-2 border rounded text-gray-700 hover:bg-gray-50">Cancel</button>
    <button class="text-sm px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-500">Deploy</button>
  </div>
</div>

<div class=" flex items-center justify-center w-full dark:bg-gray-950">
  <div class="bg-white dark:bg-gray-900 shadow-md rounded-lg px-8 py-6 max-w-md">
    <h1 class="text-2xl font-bold text-center mb-4 dark:text-gray-200">Welcome Back!</h1>
    <form action="#">
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
        <input type="email" id="email"
          class="shadow-sm rounded-md w-full px-3 py-2 border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
          placeholder="your@email.com" required>
      </div>
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
        <input type="password" id="password"
          class="shadow-sm rounded-md w-full px-3 py-2 border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
          placeholder="Enter your password" required>
        <a href="#"
          class="text-xs text-gray-600 hover:text-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Forgot
          Password?</a>
      </div>
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center">
          <input type="checkbox" id="remember"
            class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 focus:outline-none" checked>
          <label for="remember" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Remember me</label>
        </div>
        <a href="#"
          class="text-xs text-indigo-500 hover:text-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Create
          Account</a>
      </div>
      <button type="submit"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Login</button>
    </form>
  </div>
</div>
